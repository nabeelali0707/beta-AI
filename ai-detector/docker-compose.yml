version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///app/db_data/test.db
    volumes:
      - ./backend:/app
      - dev_sqlite_volume:/app/db_data
    command: uvicorn run:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend/nextjs
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/nextjs:/app
    command: npm run dev

volumes:
  dev_sqlite_volume:
